name: Verify

run-name: Verify ${{ github.ref_name }} (${{ github.sha }})

on:
  push:
    branches:
      - main
      - test
  pull_request:
    branches:
      - main
      - test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build renderer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source and memory submodule
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build React renderer
        working-directory: apps/control-center
        run: npx --no-install vite build
