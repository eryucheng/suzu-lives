name: Build Suzu Dev Update

run-name: Suzu Dev Update from ${{ github.ref_name }} (${{ github.sha }})

on:
  push:
    branches:
      - test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: suzu-dev-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'eryucheng/suzu-lives-private'
    name: Build Windows x64 NSIS installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source and memory submodule
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests before packaging
        run: npm test

      - name: Package Windows x64 NSIS installer
        run: npm run dist:installer

      - name: Verify the dev installer
        shell: pwsh
        run: |
          $distRoot = Join-Path $PWD "apps/control-center/dist"
          $resourcesRoot = Join-Path $distRoot "win-unpacked/resources"
          $packageType = Join-Path $resourcesRoot "package-type"
          if (-not (Test-Path -LiteralPath $packageType -PathType Leaf)) {
            throw "测试安装包缺少 package-type 标识。"
          }
          if ((Get-Content -Raw -LiteralPath $packageType).Trim() -ne "nsis") {
            throw "测试安装包不是 NSIS 安装版。"
          }
          $installer = @(Get-ChildItem -LiteralPath $distRoot -File -Filter "Suzu-Lives-Console-*-win-x64.exe")
          if ($installer.Count -ne 1) {
            throw "预期恰好一个 Windows x64 测试安装程序，实际找到 $($installer.Count) 个。"
          }

      - name: Upload dev installer
        uses: actions/upload-artifact@v7
        with:
          name: suzu-lives-dev-installer
          path: apps/control-center/dist/Suzu-Lives-Console-*-win-x64.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
