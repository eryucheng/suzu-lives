# Suzu Lives 软件助手使用的固定 Agent Core 组合。
# 这份组合提供软件助手人格、软件状态与动作桥、产品技能目录，
# 以及核对本机软件、配置和诊断信息所需的本地工具。
- id: software-assistant-persona
  name: '@suzu-lives/suzu-agent-runtime/core/persona'
  config:
    text: |-
      你是 Suzu，Suzu Lives 的软件使用助手。理解用户现在想了解、完成或解决的事情，
      并结合软件功能、当前状态和可用工具提供合适的协助。表达自然、简明，贴合用户提出的需求。

      用户已经说明清楚时，沿着用户的要求继续；缺少会影响结果的信息时，用简短具体的问题确认。
      协助方式可以是解释功能、查找信息、打开页面、整理配置、排查问题，或在用户授权范围内执行软件和本机操作。

      API Key、密码和令牌按私密字段处理。联系人资料、长期记忆和聊天记录按用户指定的
      联系人和当前需求读取与处理。
    complete: true
    includeRuntimeContext: false

# 固定助手会话的生命周期桥，负责上下文整理设置和请求钩子。
- id: lifecycle-bridge
  name: '@suzu-lives/suzu-agent-runtime/lifecycle-bridge'
  config:
    timeoutMs: 5000

# 软件导航与设置动作桥；动作范围由 Electron 宿主登记。
- id: software-assistant-bridge
  name: '@suzu-lives/suzu-agent-runtime/software-assistant-bridge'
  config:
    timeoutMs: 15000

# 软件助手可使用 Agent Core 提供的本地命令和文件工具，
# 用于核对源码、安装文件、设置与诊断结果。
- id: tool-bash
  name: '@suzu-lives/suzu-agent-runtime/core/terminal-bash'
  disabled: !!js process.platform === 'win32'
  config:
    enableRunInBackground: false

- id: tool-pwsh
  name: '@suzu-lives/suzu-agent-runtime/core/terminal-pwsh'
  disabled: !!js process.platform !== 'win32'
  config:
    enableRunInBackground: false

- id: tool-fs
  name: '@suzu-lives/suzu-agent-runtime/core/filesystem'

- id: tool-fs-search
  name: '@suzu-lives/suzu-agent-runtime/core/filesystem-search'
  config:
    sampleOverCapGlobResults: false

# 产品技能会在预设启动前复制到 Suzu 管理的 Agent Core 目录，
# 该目录是软件助手的产品说明来源。
- id: software-assistant-skill-filesystem
  name: '@suzu-lives/suzu-agent-runtime/core/skill-filesystem'
  config:
    includeDefaultRoots: false
    watch: false
    customSkillDirs:
      - !!js suzuAgentHomePath('software-assistant-skills')

- id: software-assistant-language
  name: '@suzu-lives/suzu-agent-runtime/software-assistant-language'

- id: software-assistant-tool-skill
  name: '@suzu-lives/suzu-agent-runtime/core/skill-tool'

- id: software-assistant-compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
  config:
    - id: suzu-software-assistant-compaction
      name: '@suzu-lives/suzu-agent-runtime/software-assistant-compaction'
      config:
        auto: true
        thresholdRatio: 0.8
        retainTokens: 8000
        maxTokens: 8192
        compactionRetries: 1
        maxOverflowRetries: 1
    - id: command-compact
      name: '@suzu-lives/suzu-agent-runtime/core/command-compact'
