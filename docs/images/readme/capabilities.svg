<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="310" viewBox="0 0 1120 310" role="img" aria-labelledby="title desc" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
<title id="title">Suzu Lives 的四类内置能力</title><desc id="desc">感知：图片与视频理解。陪伴：语音消息与实时通话。行动：网页浏览与本机文件。创作：图片生成与编辑。对应服务按需配置。</desc>
<style>:root{--bg:#f8f6fc;--panel:#fff;--border:#e6dfef;--text:#332940;--muted:#80738e;--accent:#8d70b6;--soft:#f1eaf9}@media(prefers-color-scheme:dark){:root{--bg:#14111b;--panel:#1e1728;--border:#3e2f50;--text:#eee6f7;--muted:#b29cc7;--accent:#c2a0ed;--soft:#2a2039}}.bg{fill:var(--bg);stroke:var(--border)}.panel{fill:var(--panel);stroke:var(--border)}.title{fill:var(--text)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.icon{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}</style>
